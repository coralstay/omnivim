# ---
# title: ci
# description: 설치·환경 검증·144팁 자동 풀이 감사를 macOS에서 돌리는 GitHub Actions CI 워크플로
# authors: [coralstay]
# license: AGPL-3.0-only
# status: draft
# created_date: '2026-11-06'
# updated_date: '2026-11-06'
# ---
name: OmniVim CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-verify:
    name: Verify 144 Tips Curriculum & Cross-IDE Parity
    runs-on: macos-latest  # ---- 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Neovim & Core Tools
        run: |
          brew install neovim

      - name: Check Shell Script Syntax  # ---- 2
        run: |
          bash -n scripts/*.sh *.sh bin/*

      - name: Run OmniVim Master Installer  # ---- 3
        run: |
          bash ./install.sh

      - name: Verify Environment Parity  # ---- 4
        run: |
          bash ./verify_all.sh

      - name: Run Full 144-Tip Autonomous Solving Audit  # ---- 5
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from omnivim_ai import OmniVimAI

          ai = OmniVimAI()
          failed = []
          for i in range(1, 145):
              res = ai.solve_tip(i)
              if not res.get('passed'):
                  failed.append((i, res.get('error', ''), res.get('diff', '')))
          
          print(f'Autosolve Audit: {144 - len(failed)}/144 PASSED')
          if failed:
              for f in failed:
                  print(f'Tip {f[0]} FAILED: {f[1]}\n{f[2]}')
              sys.exit(1)
          "

      - name: Run Comprehensive System Audit  # ---- 6
        run: |
          python3 scripts/audit_all.py

# ======== 노트 ========
# 1 macOS 러너
#   설명: 설치 스크립트가 macOS 경로(Library/Application Support)를 쓰고 Computer Use 브리지가 macOS 전용이라 macos-latest에서 돈다.
#   관련: install.sh, scripts/computer_use.py
# 2 스크립트 구문 점검
#   설명: bash -n으로 모든 셸 스크립트의 구문만 먼저 검사한다. 실행하지 않으므로 설치 전에 싸게 걸러낸다.
# 3 마스터 설치 실행
#   설명: install.sh를 CI 홈 디렉터리에 그대로 돌린다. 설정 배포와 실습 스캐폴딩, 마지막 verify_all.sh까지 포함한다.
#   관련: install.sh
# 4 환경 일치 확인
#   설명: 설치 뒤 verify_all.sh로 설정이 실제로 적용됐는지 본다.
#   관련: verify_all.sh
# 5 144팁 자동 풀이 감사
#   설명: omnivim_ai의 solve_tip으로 1~144를 모두 풀고, 하나라도 실패하면 종료 코드 1로 워크플로를 실패시킨다.
#   관련: scripts/omnivim_ai.py
# 6 종합 시스템 감사
#   설명: audit_all.py가 설정, 키맵, 문서, AI 인터페이스를 한꺼번에 검사한다. 실패 항목이 있으면 종료 코드 1이다.
#   관련: scripts/audit_all.py
